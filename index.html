<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMU Bank of Clothes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="Images/pmu-logo.png" alt="PMU Logo">
        <h1>PMU Bank of Clothes</h1>
    </header>

    <div class="container">
        <h2>Create an Account</h2>

        <form>

            <label>Full Name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Password</label>
            <input type="password">

            <div class="role-section">
                <span>Role :</span>

                <label class="radio">
                    <input type="radio" name="role">
                    Student
                </label>

                <label class="radio">
                    <input type="radio" name="role">
                    Benificary
                </label>
            </div>

            <button type="submit">Create Account</button>

        </form>
    </div>

</body>
</html>
